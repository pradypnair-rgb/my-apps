<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HabitBox • Daily Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --card-border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #3B82F6;
      --success: #10B981;
      --cell-empty: #E2E8F0;
      --radius: 16px;
      --transition: all 0.15s ease-in-out;

      --color-1: #F97316; /* Orange - Exercise */
      --color-2: #0EA5E9; /* Cyan/Blue - Water */
      --color-3: #10B981; /* Emerald - Reading */
      --color-4: #8B5CF6; /* Purple - General */
      --color-5: #EC4899; /* Pink */
      --color-6: #EAB308; /* Amber */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    button.btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    button.btn-action.primary {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    button.btn-action.primary:hover {
      background: #2563EB;
    }

    button.btn-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Overall Summary Dashboard */
    .overview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .overview-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #3B82F6, #8B5CF6, #10B981, #F97316);
    }

    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .overview-title {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .overview-month-pill {
      font-size: 0.75rem;
      font-weight: 700;
      background: #EFF6FF;
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .ov-box {
      background: #F8FAFC;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .ov-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .ov-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    .ov-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Weekly Bar Chart */
    .weekly-bars-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .weekly-bars-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: space-between;
    }

    .weekly-bars {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.45rem;
      align-items: end;
      height: 90px;
      padding-top: 0.5rem;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 0.3rem;
    }

    .bar-track {
      width: 100%;
      background: #F1F5F9;
      border-radius: 6px;
      height: 55px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      background: var(--accent);
      border-radius: 6px;
      transition: height 0.3s ease-out;
    }

    .bar-fill.full {
      background: var(--success);
    }

    .bar-day-name {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-count {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Habit Breakdown List */
    .habit-progress-breakdown {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--card-border);
    }

    .habit-prog-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .habit-prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .habit-prog-track {
      width: 100%;
      height: 8px;
      background: #F1F5F9;
      border-radius: 999px;
      overflow: hidden;
    }

    .habit-prog-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease-out;
    }

    .habit-prog-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 0.5rem;
      padding-left: 0.25rem;
    }

    /* Habit Cards */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .habit-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .habit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background-color: var(--card-accent, #3B82F6);
    }

    .habit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .habit-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .habit-icon {
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #F1F5F9;
    }

    .habit-title-box {
      display: flex;
      flex-direction: column;
    }

    .habit-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .habit-target-hint {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background-color: #ECFDF5;
      color: #059669;
      padding: 0.35rem 0.65rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .stats-btn {
      background: #F1F5F9;
      border: none;
      padding: 0.35rem 0.65rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      transition: var(--transition);
    }

    .stats-btn:hover {
      background: #DBEAFE;
    }

    .btn-delete-habit {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.35rem;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-delete-habit:hover {
      color: #EF4444;
      background: #FEE2E2;
    }

    /* 7-Day Buttons */
    .habit-checkbox-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .day-check-btn {
      height: 72px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      transition: var(--transition);
      outline: none;
      position: relative;
    }

    .day-check-btn * {
      pointer-events: none;
    }

    .day-check-btn:hover {
      border-color: #94A3B8;
      transform: translateY(-2px);
    }

    .day-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .day-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .day-val-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      background: #F1F5F9;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      margin-top: 1px;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-check-btn.today {
      border: 2px solid var(--accent);
    }

    .day-check-btn.checked {
      background-color: var(--success) !important;
      border-color: var(--success) !important;
    }

    .day-check-btn.checked .day-label,
    .day-check-btn.checked .day-date {
      color: #FFFFFF !important;
    }

    .day-check-btn.checked .day-val-tag {
      background: rgba(255, 255, 255, 0.25) !important;
      color: #FFFFFF !important;
    }

    /* 30-Day Heatmap Mini-Bar */
    .heatmap-cells {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
    }

    .heatmap-box {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--cell-empty);
      cursor: pointer;
      transition: var(--transition);
    }

    .heatmap-box.active {
      background: var(--success);
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42
