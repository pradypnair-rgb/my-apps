<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HabitBox • Daily Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --card-border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #2563EB;
      --success: #10B981;
      --partial: #F59E0B;
      --cell-empty: #E2E8F0;
      --radius: 16px;
      --transition: all 0.15s ease-in-out;

      --color-1: #EA580C; /* Vibrant Orange */
      --color-2: #0284C7; /* Sky Blue */
      --color-3: #059669; /* Emerald */
      --color-4: #7C3AED; /* Purple */
      --color-5: #DB2777; /* Pink */
      --color-6: #D97706; /* Amber */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 0.75rem 2.5rem 0.75rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 0.4rem;
    }

    button.btn-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }

    button.btn-action.primary {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    button.btn-action.primary:hover {
      background: #1D4ED8;
    }

    button.btn-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Overall Summary Dashboard */
    .overview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      position: relative;
      overflow: hidden;
    }

    .overview-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #2563EB, #7C3AED, #059669, #EA580C);
    }

    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .overview-title {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .overview-month-pill {
      font-size: 0.7rem;
      font-weight: 700;
      background: #EFF6FF;
      color: var(--accent);
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    .overview-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .ov-box {
      background: #F8FAFC;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .ov-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ov-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ov-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Weekly Bar Chart */
    .weekly-bars-container {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .weekly-bars-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .weekly-bars {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
      align-items: end;
      height: 85px;
      padding-top: 0.35rem;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 0.25rem;
      min-width: 0;
    }

    .bar-track {
      width: 100%;
      max-width: 32px;
      background: #F1F5F9;
      border-radius: 6px;
      height: 50px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      width: 100%;
      background: var(--accent);
      border-radius: 6px;
      transition: height 0.3s ease-out;
    }

    .bar-fill.full {
      background: var(--success);
    }

    .bar-day-name {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-count {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Habit Breakdown List */
    .habit-progress-breakdown {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--card-border);
    }

    .habit-prog-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .habit-prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .habit-prog-track {
      width: 100%;
      height: 7px;
      background: #F1F5F9;
      border-radius: 999px;
      overflow: hidden;
    }

    .habit-prog-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease-out;
    }

    .habit-prog-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 0.25rem;
      padding-left: 0.2rem;
    }

    /* Habit Cards */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .habit-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .habit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background-color: var(--card-accent, #2563EB);
    }

    .habit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .habit-meta {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .habit-icon {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      background: #F1F5F9;
    }

    .habit-title-box {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .habit-title {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-target-hint {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background-color: #ECFDF5;
      color: #059669;
      padding: 0.3rem 0.55rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .stats-btn {
      background: #F1F5F9;
      border: none;
      padding: 0.3rem 0.55rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .stats-btn:hover {
      background: #DBEAFE;
    }

    .btn-delete-habit {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-delete-habit:hover {
      color: #EF4444;
      background: #FEE2E2;
    }

    /* 7-Day Buttons Grid: Strict minmax(0, 1fr) to prevent Chrome overflow */
    .habit-checkbox-row {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
      width: 100%;
    }

    .day-check-btn {
      min-width: 0;
      height: 70px;
      border-radius: 10px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      transition: var(--transition);
      outline: none;
      position: relative;
      overflow: hidden;
      padding: 0.15rem 0.1rem;
    }

    .day-check-btn * {
      pointer-events: none;
    }

    .day-check-btn:hover {
      border-color: #94A3B8;
    }

    .day-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1;
    }

    .day-date {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .day-val-tag {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--text-muted);
      background: #F1F5F9;
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
      margin-top: 1px;
      max-width: 95%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .day-check-btn.today {
      border: 2px solid var(--accent);
    }

    /* Target Achieved: Full Green */
    .day-check-btn.completed {
      background-color: var(--success) !important;
      border-color: var(--success) !important;
    }

    .day-check-btn.completed .day-label,
    .day-check-btn.completed .day-date {
      color: #FFFFFF !important;
    }

    .day-check-btn.completed .day-val-tag {
      background: rgba(255, 255, 255, 0.25) !important;
      color: #FFFFFF !important;
    }

    /* Target Incomplete / Partial: Amber */
    .day-check-btn.partial {
      background-color: var(--partial) !important;
      border-color: var(--partial) !important;
    }

    .day-check-btn.partial .day-label,
    .day-check-btn.partial .day-date {
      color: #FFFFFF !important;
    }

    .day-check-btn.partial .day-val-tag {
      background: rgba(255, 255, 255, 0.25) !important;
      color: #FFFFFF !important;
    }

    .day-meter-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #E2E8F0;
    }

    .day-meter-fill {
      height: 100%;
      background: var(--success);
    }

    .day-check-btn.partial .day-meter-fill {
      background: #D97706;
    }

    .day-check-btn.completed .day-meter-fill {
      background: #059669;
    }

    /* 30-Day Heatmap Mini-Bar */
    .heatmap-cells {
      display: flex;
      justify-content: space-between;
      gap: 3px;
      padding-top: 0.65rem;
      border-top: 1px solid var(--card-border);
    }

    .heatmap-box {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 2.5px;
      background: var(--cell-empty);
      cursor: pointer;
      min-width: 0;
    }

    .heatmap-box.completed {
      background: var(--success);
    }

    .heatmap-box.partial {
      background: var(--partial);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .modal-close {
      background: #F1F5F9;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .stat-tile {
      border-radius: 12px;
      padding: 0.75rem 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #fff;
    }

    .stat-tile.orange { background: #EA580C; }
    .stat-tile.blue { background: #2563EB; }
    .stat-tile.pink { background: #E11D48; }

    .stat-label {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 0.15rem;
      opacity: 0.95;
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    .month-nav-btn {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text);
      padding: 0.2rem 0.5rem;
    }

    .month-display {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .calendar-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: #F8FAFC;
      border-radius: 14px;
      padding: 0.75rem;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
    }

    .cal-day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text);
      user-select: none;
    }

    .cal-day-cell.empty {
      cursor: default;
    }

    .cal-day-cell:not(.empty):hover {
      background: #E2E8F0;
    }

    .cal-day-cell.completed {
      background: var(--success) !important;
      color: #fff !important;
      font-weight: 700;
    }

    .cal-day-cell.partial {
      background: var(--partial) !important;
      color: #fff !important;
      font-weight: 700;
    }

    .cal-day-cell.today-circle {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .log-target-preview {
      background: #F1F5F9;
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-badge-preview {
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .status-badge-preview.met { background: #DCFCE7; color: #15803D; }
    .status-badge-preview.under { background: #FEF3C7; color: #B45309; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .form-input, .form-select {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      border: 1.5px solid var(--card-border);
      background: #F8FAFC;
      font-size: 0.9rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
      background: #FFF;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .btn-submit {
      background: var(--accent);
      color: #FFF;
      border: none;
      padding: 0.7rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0.35rem;
    }

    .btn-submit:hover {
      background: #1D4ED8;
    }

    .btn-clear-entry {
      background: #FEE2E2;
      color: #DC2626;
      border: none;
      padding: 0.7rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Habit<span>Box</span></h1>
      <div class="header-actions">
        <button class="btn-action primary" onclick="openAddHabitModal()">+ Add</button>
        <button class="btn-action" id="export-btn">Export</button>
      </div>
    </header>

    <div class="overview-card" id="overview-card">
      <div class="overview-header">
        <div class="overview-title">📊 Monthly Overview</div>
        <div class="overview-month-pill" id="overview-month-tag">Month 2026</div>
      </div>

      <div class="overview-stats">
        <div class="ov-box">
          <span class="ov-label">Goals Met</span>
          <span class="ov-value" id="ov-total-month">0</span>
          <span class="ov-sub" id="ov-month-rate">0% hit rate</span>
        </div>
        <div class="ov-box">
          <span class="ov-label">Top Habit</span>
          <span class="ov-value" id="ov-top-habit">—</span>
          <span class="ov-sub" id="ov-top-habit-stat">0 days</span>
        </div>
      </div>

      <div class="weekly-bars-container">
        <div class="weekly-bars-title">
          <span>7-Day Trend</span>
          <span id="ov-week-rate">0%</span>
        </div>
        <div class="weekly-bars" id="overview-weekly-bars"></div>
      </div>

      <div class="habit-progress-breakdown" id="overview-habit-breakdown"></div>
    </div>

    <div class="section-title">Daily Habits</div>
    <div class="habit-list" id="habit-list"></div>
  </div>

  <div class="modal-overlay" id="stats-modal">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-title" id="modal-habit-title">🏃‍♂️ Exercise</div>
        <button class="modal-close" onclick="closeModal('stats-modal')">✕</button>
      </div>

      <div class="stats-grid">
        <div class="stat-tile orange">
          <span class="stat-label">Best Streak</span>
          <span class="stat-val" id="stat-best-streak">0d</span>
        </div>
        <div class="stat-tile blue">
          <span class="stat-label" id="stat-total-label">Total</span>
          <span class="stat-val" id="stat-month-total">0</span>
        </div>
        <div class="stat-tile pink">
          <span class="stat-label">Hit Rate</span>
          <span class="stat-val" id="stat-month-rate">0%</span>
        </div>
      </div>

      <div class="calendar-header">
        <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
        <span class="month-display" id="month-name-display">Month 2026</span>
        <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="calendar-body">
        <div class="cal-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-days-grid" id="calendar-days"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="log-modal">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-title" id="log-modal-title">Log Progress</div>
        <button class="modal-close" onclick="closeModal('log-modal')">✕</button>
      </div>
      <form id="log-form" onsubmit="handleLogSubmit(event)">
        <div class="log-target-preview" id="log-target-info">
          <span id="log-target-text">Target: 30 mins</span>
          <span class="status-badge-preview under" id="log-status-badge">Partial</span>
        </div>
        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="form-label" id="log-input-label">Enter amount:</label>
          <input type="number" step="any" class="form-input" id="log-input-val" required autofocus oninput="updateLiveTargetStatus()" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
          <button type="submit" class="btn-submit">Save Entry</button>
          <button type="button" class="btn-clear-entry" id="btn-clear-entry" onclick="handleClearEntry()">Clear Day</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="add-habit-modal">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-title">✨ Add Habit</div>
        <button class="modal-close" onclick="closeModal('add-habit-modal')">✕</button>
      </div>
      <form id="add-habit-form" onsubmit="handleAddHabit(event)" style="display: flex; flex-direction: column; gap: 0.85rem;">
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label class="form-label">Name</label>
            <input type="text" class="form-input" id="new-habit-name" placeholder="e.g. Meditation" required />
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Emoji</label>
            <input type="text" class="form-input" id="new-habit-icon" placeholder="🧘" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="new-habit-type" onchange="toggleAddTargetFields()">
            <option value="numeric">Numeric Target</option>
            <option value="binary">Simple Checkbox</option>
          </select>
        </div>

        <div class="form-row" id="target-fields-row">
          <div class="form-group">
            <label class="form-label">Unit</label>
            <input type="text" class="form-input" id="new-habit-unit" placeholder="mins, L, pages" />
          </div>
          <div class="form-group">
            <label class="form-label">Daily Goal</label>
            <input type="number" step="any" class="form-input" id="new-habit-target" placeholder="30" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Theme Color</label>
          <select class="form-select" id="new-habit-color">
            <option value="#EA580C">Orange</option>
            <option value="#0284C7">Sky Blue</option>
            <option value="#059669">Emerald Green</option>
            <option value="#7C3AED">Purple</option>
            <option value="#DB2777">Pink</option>
            <option value="#D97706">Amber</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">+ Create Habit</button>
      </form>
    </div>
  </div>

  <script>
    const default_habits = [
      { id: '1', name: 'Exercise', icon: '🏃‍♂️', type: 'numeric', unit: 'mins', target: 30, color: '#EA580C', history: {} },
      { id: '2', name: 'Water Intake', icon: '💧', type: 'numeric', unit: 'L', target: 3, color: '#0284C7', history: {} },
      { id: '3', name: 'Reading', icon: '📖', type: 'numeric', unit: 'pages', target: 20, color: '#059669', history: {} }
    ];

    let habits = [];
    try {
      const stored = localStorage.getItem('habitbox_mobile_data');
      if (stored) habits = JSON.parse(stored);
    } catch(e) { habits = []; }

    if (!Array.isArray(habits) || habits.length === 0) {
      habits = JSON.parse(JSON.stringify(default_habits));
    } else {
      default_habits.forEach(def => {
        const existing = habits.find(h => h.id === def.id || (h.name && h.name.toLowerCase() === def.name.toLowerCase()));
        if (!existing) {
          habits.push(JSON.parse(JSON.stringify(def)));
        } else {
          if (!existing.type) existing.type = def.type;
          if (!existing.unit) existing.unit = def.unit;
          if (!existing.target) existing.target = def.target;
          if (!existing.color) existing.color = def.color;
          if (existing.name === '3 ltrs of water') existing.name = 'Water Intake';
        }
      });
    }

    let selectedHabitId = null;
    let activeLogContext = { habitId: null, dateStr: null };
    let viewDate = new Date();

    function saveState() {
      try {
        localStorage.setItem('habitbox_mobile_data', JSON.stringify(habits));
      } catch(e) {}
      render();
      if (selectedHabitId) renderModal();
    }

    const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function formatDate(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getLast7Days() {
      const dates = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        dates.push(formatDate(d));
      }
      return dates;
    }

    function getLast30Days() {
      const dates = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        dates.push(formatDate(d));
      }
      return dates;
    }

    function getDayGoalStatus(habit, dateStr) {
      if (!habit.history || habit.history[dateStr] === undefined) return 'none';
      const val = habit.history[dateStr];
      if (habit.type === 'numeric') {
        const numVal = Number(val) || 0;
        if (numVal <= 0) return 'none';
        if (habit.target && habit.target > 0) {
          return numVal >= habit.target ? 'completed' : 'partial';
        }
        return 'completed';
      }
      return Boolean(val) ? 'completed' : 'none';
    }

    function calculateStreak(habit) {
      if (!habit.history) return 0;
      let streak = 0;
      let d = new Date();
      let todayStr = formatDate(d);

      if (getDayGoalStatus(habit, todayStr) === 'none') {
        d.setDate(d.getDate() - 1);
      }

      while (true) {
        const checkStr = formatDate(d);
        if (getDayGoalStatus(habit, checkStr) !== 'none') {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function calculateBestStreak(habit) {
      if (!habit.history) return 0;
      const sortedDates = Object.keys(habit.history).filter(d => getDayGoalStatus(habit, d) !== 'none').sort();
      if (sortedDates.length === 0) return 0;

      let maxStreak = 1;
      let currentStreak = 1;

      for (let i = 1; i < sortedDates.length; i++) {
        const prev = new Date(sortedDates[i - 1]);
        const curr = new Date(sortedDates[i]);
        const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          currentStreak++;
          if (currentStreak > maxStreak) maxStreak = currentStreak;
        } else if (diffDays > 1) {
          currentStreak = 1;
        }
      }
      return maxStreak;
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
      if (modalId === 'stats-modal') selectedHabitId = null;
    }

    function openModal(habitId) {
      selectedHabitId = habitId;
      viewDate = new Date();
      document.getElementById('stats-modal').classList.add('open');
      renderModal();
    }

    function openAddHabitModal() {
      document.getElementById('add-habit-modal').classList.add('open');
    }

    function toggleAddTargetFields() {
      const type = document.getElementById('new-habit-type').value;
      const row = document.getElementById('target-fields-row');
      row.style.display = (type === 'numeric') ? 'grid' : 'none';
    }

    function handleAddHabit(e) {
      e.preventDefault();
      const name = document.getElementById('new-habit-name').value.trim();
      const icon = document.getElementById('new-habit-icon').value.trim() || '🎯';
      const type = document.getElementById('new-habit-type').value;
      const unit = document.getElementById('new-habit-unit').value.trim() || '';
      const target = parseFloat(document.getElementById('new-habit-target').value) || 0;
      const color = document.getElementById('new-habit-color').value;

      if (!name) return;

      habits.push({
        id: Date.now().toString(),
        name,
        icon,
        type,
        unit,
        target,
        color,
        history: {}
      });

      saveState();
      closeModal('add-habit-modal');
      document.getElementById('add-habit-form').reset();
      toggleAddTargetFields();
    }

    function deleteHabit(habitId) {
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;
      if (confirm(`Delete "${habit.name}"?`)) {
        habits = habits.filter(h => h.id !== habitId);
        saveState();
      }
    }

    function handleDayClick(habitId, dateStr) {
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;

      if (habit.type === 'numeric') {
        activeLogContext = { habitId, dateStr };
        const currentVal = habit.history[dateStr] || '';
        document.getElementById('log-modal-title').innerText = `${habit.icon} ${habit.name}`;
        document.getElementById('log-input-label').innerText = `Amount for ${dateStr} (${habit.unit || 'units'}):`;
        
        const targetText = habit.target ? `Target: ${habit.target} ${habit.unit}` : 'No target';
        document.getElementById('log-target-text').innerText = targetText;
        
        const input = document.getElementById('log-input-val');
        input.value = currentVal;
        input.placeholder = habit.target ? `${habit.target}` : '0';
        updateLiveTargetStatus();

        document.getElementById('log-modal').classList.add('open');
        setTimeout(() => input.focus(), 100);
      } else {
        if (habit.history[dateStr]) {
          delete habit.history[dateStr];
        } else {
          habit.history[dateStr] = true;
        }
        saveState();
      }
    }

    function updateLiveTargetStatus() {
      const { habitId } = activeLogContext;
      const habit = habits.find(h => h.id === habitId);
      if (!habit) return;

      const val = parseFloat(document.getElementById('log-input-val').value) || 0;
      const badge = document.getElementById('log-status-badge');

      if (!habit.target || habit.target <= 0) {
        badge.innerText = 'Logged';
        badge.className = 'status-badge-preview met';
        return;
      }

      if (val >= habit.target) {
        badge.innerText = `Goal Met (≥ ${habit.target})`;
        badge.className = 'status-badge-preview met';
      } else if (val > 0) {
        badge.innerText = `Partial (< ${habit.target})`;
        badge.className = 'status-badge-preview under';
      } else {
        badge.innerText = `Incomplete`;
        badge.className = 'status-badge-preview under';
      }
    }

    function handleLogSubmit(e) {
      e.preventDefault();
      const val = parseFloat(document.getElementById('log-input-val').value);
      const { habitId, dateStr } = activeLogContext;
      const habit = habits.find(h => h.id === habitId);

      if (habit && !isNaN(val)) {
        if (!habit.history) habit.history = {};
        if (val <= 0) {
          delete habit.history[dateStr];
        } else {
          habit.history[dateStr] = val;
        }
        saveState();
      }
      closeModal('log-modal');
    }

    function handleClearEntry() {
      const { habitId, dateStr } = activeLogContext;
      const habit = habits.find(h => h.id === habitId);
      if (habit && habit.history && habit.history[dateStr] !== undefined) {
        delete habit.history[dateStr];
        saveState();
      }
      closeModal('log-modal');
    }

    function renderOverview() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      document.getElementById('overview-month-tag').innerText = `${monthNames[month]} ${year}`;

      const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
      const totalHabits = habits.length;

      let totalMonthTargetMet = 0;
      let habitMonthStats = [];
      const recent7Days = getLast7Days();

      habits.forEach(habit => {
        let fullGoalCount = 0;
        let anyActivityCount = 0;
        let monthTotalAmount = 0;
        let weekTotalAmount = 0;

        for (let day = 1; day <= totalDaysInMonth; day++) {
          const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const status = getDayGoalStatus(habit, dStr);
          if (status === 'completed') {
            fullGoalCount++;
            totalMonthTargetMet++;
          }
          if (status !== 'none') {
            anyActivityCount++;
            if (habit.type === 'numeric') {
              monthTotalAmount += Number(habit.history[dStr]) || 0;
            }
          }
        }

        recent7Days.forEach(dateStr => {
          if (getDayGoalStatus(habit, dateStr) !== 'none' && habit.type === 'numeric') {
            weekTotalAmount += Number(habit.history[dateStr]) || 0;
          }
        });

        habitMonthStats.push({
          id: habit.id,
          name: habit.name,
          icon: habit.icon,
          color: habit.color || '#2563EB',
          type: habit.type,
          unit: habit.unit,
          target: habit.target,
          fullCount: fullGoalCount,
          activityCount: anyActivityCount,
          monthTotal: monthTotalAmount,
          weekTotal: weekTotalAmount,
          rate: Math.round((fullGoalCount / totalDaysInMonth) * 100)
        });
      });

      const maxPossibleMonth = totalDaysInMonth * totalHabits;
      const overallMonthRate = maxPossibleMonth > 0 ? Math.round((totalMonthTargetMet / maxPossibleMonth) * 100) : 0;

      document.getElementById('ov-total-month').innerText = `${totalMonthTargetMet}`;
      document.getElementById('ov-month-rate').innerText = `${overallMonthRate}% hit rate`;

      habitMonthStats.sort((a, b) => b.fullCount - a.fullCount);
      const topHabit = habitMonthStats[0];
      if (topHabit && topHabit.fullCount > 0) {
        document.getElementById('ov-top-habit').innerText = `${topHabit.icon} ${topHabit.name}`;
        document.getElementById('ov-top-habit-stat').innerText = `${topHabit.fullCount}d on target`;
      } else {
        document.getElementById('ov-top-habit').innerText = `—`;
        document.getElementById('ov-top-habit-stat').innerText = `0d on target`;
      }

      const weeklyBarsEl = document.getElementById('overview-weekly-bars');
      weeklyBarsEl.innerHTML = '';

      let totalWeeklyFullGoals = 0;
      const maxPossibleWeek = 7 * totalHabits;

      recent7Days.forEach(dateStr => {
        const parts = dateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayName = weekDays[d.getDay()];

        let dayFullCount = 0;
        habits.forEach(h => {
          if (getDayGoalStatus(h, dateStr) === 'completed') dayFullCount++;
        });

        totalWeeklyFullGoals += dayFullCount;
        const fillPercent = totalHabits > 0 ? Math.round((dayFullCount / totalHabits) * 100) : 0;

        const col = document.createElement('div');
        col.className = 'bar-col';
        col.innerHTML = `
          <span class="bar-count">${dayFullCount}/${totalHabits}</span>
          <div class="bar-track">
            <div class="bar-fill ${fillPercent === 100 ? 'full' : ''}" style="height: ${fillPercent}%;"></div>
          </div>
          <span class="bar-day-name">${dayName[0]}</span>
        `;
        weeklyBarsEl.appendChild(col);
      });

      const weekConsistency = maxPossibleWeek > 0 ? Math.round((totalWeeklyFullGoals / maxPossibleWeek) * 100) : 0;
      document.getElementById('ov-week-rate').innerText = `${weekConsistency}% week compliance`;

      const breakdownEl = document.getElementById('overview-habit-breakdown');
      breakdownEl.innerHTML = '';

      habitMonthStats.forEach(item => {
        const row = document.createElement('div');
        row.className = 'habit-prog-row';

        let subDetail = `${item.fullCount}/${totalDaysInMonth}d met (${item.rate}%)`;
        if (item.type === 'numeric') {
          subDetail = `W: <strong>${Math.round(item.weekTotal * 10)/10} ${item.unit}</strong> | M: <strong>${Math.round(item.monthTotal * 10)/10} ${item.unit}</strong> (${item.fullCount}d on-target)`;
        }

        row.innerHTML = `
          <div class="habit-prog-label">
            <span>${item.icon} ${escapeHtml(item.name)}</span>
            <span>${item.rate}%</span>
          </div>
          <div class="habit-prog-track">
            <div class="habit-prog-fill" style="width: ${item.rate}%; background-color: ${item.color};"></div>
          </div>
          <div class="habit-prog-sub">
            <span>${subDetail}</span>
          </div>
        `;
        breakdownEl.appendChild(row);
      });
    }

    const habitListEl = document.getElementById('habit-list');

    function render() {
      renderOverview();
      habitListEl.innerHTML = '';
      const recent7Days = getLast7Days();
      const recent30Days = getLast30Days();
      const todayStr = formatDate(new Date());

      habits.forEach((habit) => {
        const streak = calculateStreak(habit);
        
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.style.setProperty('--card-accent', habit.color || '#2563EB');

        let targetHint = '';
        if (habit.type === 'numeric' && habit.target) {
          targetHint = `Target: ${habit.target} ${habit.unit}/day`;
        }

        const header = document.createElement('div');
        header.className = 'habit-header';
        header.innerHTML = `
          <div class="habit-meta">
            <div class="habit-icon">${habit.icon || '🎯'}</div>
            <div class="habit-title-box">
              <div class="habit-title">${escapeHtml(habit.name || 'Habit')}</div>
              ${targetHint ? `<div class="habit-target-hint">${targetHint}</div>` : ''}
            </div>
          </div>
          <div class="header-pills">
            <button class="stats-btn" id="btn-stats-${habit.id}">📊 Stats</button>
            <div class="streak-badge">🔥 ${streak}d</div>
            <button class="btn-delete-habit" title="Delete Habit" onclick="deleteHabit('${habit.id}')">✕</button>
          </div>
        `;

        const statsBtn = header.querySelector(`#btn-stats-${habit.id}`);
        statsBtn.addEventListener('click', () => openModal(habit.id));

        const checkRow = document.createElement('div');
        checkRow.className = 'habit-checkbox-row';

        recent7Days.forEach(dateStr => {
          const parts = dateStr.split('-');
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          const dayName = weekDays[d.getDay()];
          const status = getDayGoalStatus(habit, dateStr);
          const isToday = (dateStr === todayStr);

          let valBadge = '';
          let meterPercent = 0;

          if (habit.type === 'numeric') {
            const rawVal = habit.history ? habit.history[dateStr] : null;
            if (rawVal !== undefined && rawVal !== null) {
              valBadge = `<span class="day-val-tag">${rawVal}</span>`;
              if (habit.target && habit.target > 0) {
                meterPercent = Math.min(100, Math.round((Number(rawVal) / habit.target) * 100));
              } else {
                meterPercent = 100;
              }
            } else {
              valBadge = `<span class="day-val-tag">+</span>`;
            }
          } else {
            meterPercent = (status === 'completed') ? 100 : 0;
          }

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `day-check-btn ${status} ${isToday ? 'today' : ''}`;
          btn.innerHTML = `
            <span class="day-label">${dayName[0]}</span>
            <span class="day-date">${d.getDate()}</span>
            ${valBadge}
            <div class="day-meter-track">
              <div class="day-meter-fill" style="width: ${meterPercent}%;"></div>
            </div>
          `;
          
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleDayClick(habit.id, dateStr);
          });

          checkRow.appendChild(btn);
        });

        const heatmap = document.createElement('div');
        heatmap.className = 'heatmap-cells';
        recent30Days.forEach(dateStr => {
          const status = getDayGoalStatus(habit, dateStr);
          const box = document.createElement('div');
          box.className = `heatmap-box ${status}`;
          const val = habit.history ? habit.history[dateStr] : null;
          box.title = val ? `${dateStr}: ${val} ${habit.unit || ''} (${status})` : dateStr;
          
          box.addEventListener('click', (e) => {
            e.stopPropagation();
            handleDayClick(habit.id, dateStr);
          });

          heatmap.appendChild(box);
        });

        card.appendChild(header);
        card.appendChild(checkRow);
        card.appendChild(heatmap);
        habitListEl.appendChild(card);
      });
    }

    function changeMonth(delta) {
      viewDate.setMonth(viewDate.getMonth() + delta);
      renderModal();
    }

    function renderModal() {
      const habit = habits.find(h => h.id === selectedHabitId);
      if (!habit) return;

      document.getElementById('modal-habit-title').innerHTML = `${habit.icon || '🎯'} ${escapeHtml(habit.name || 'Habit')}`;

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      document.getElementById('month-name-display').innerText = `${monthNames[month]} ${year}`;

      const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
      let monthCompletedDays = 0;
      let monthTotalAmount = 0;

      for (let day = 1; day <= totalDaysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const status = getDayGoalStatus(habit, dStr);
        if (status === 'completed') {
          monthCompletedDays++;
        }
        if (status !== 'none' && habit.type === 'numeric') {
          monthTotalAmount += Number(habit.history[dStr]) || 0;
        }
      }

      const bestStreak = calculateBestStreak(habit);
      const completionRate = Math.round((monthCompletedDays / totalDaysInMonth) * 100);

      document.getElementById('stat-best-streak').innerText = `${bestStreak}d`;
      
      if (habit.type === 'numeric') {
        document.getElementById('stat-total-label').innerText = `Total (${habit.unit})`;
        document.getElementById('stat-month-total').innerText = `${Math.round(monthTotalAmount * 10)/10}`;
      } else {
        document.getElementById('stat-total-label').innerText = `Goals Met`;
        document.getElementById('stat-month-total').innerText = `${monthCompletedDays}d`;
      }

      document.getElementById('stat-month-rate').innerText = `${completionRate}%`;

      const calendarDaysEl = document.getElementById('calendar-days');
      calendarDaysEl.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const todayStr = formatDate(new Date());

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-day-cell empty';
        calendarDaysEl.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDaysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const status = getDayGoalStatus(habit, dStr);
        const isToday = (dStr === todayStr);

        const cell = document.createElement('div');
        cell.className = `cal-day-cell ${status} ${isToday ? 'today-circle' : ''}`;
        cell.innerText = day;

        cell.addEventListener('click', () => {
          handleDayClick(habit.id, dStr);
        });

        calendarDaysEl.appendChild(cell);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(habits, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `habitbox-backup-${formatDate(new Date())}.json`;
      a.click();
    });

    render();
  </script>
</body>
</html>
