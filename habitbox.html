<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HabitBox • Daily Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --card-border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #3B82F6;
      --success: #10B981;
      --cell-empty: #E2E8F0;
      --radius: 16px;
      --transition: all 0.2s ease-in-out;

      --habit-color-1: #F97316; /* Orange */
      --habit-color-2: #8B5CF6; /* Purple */
      --habit-color-3: #0EA5E9; /* Cyan */
      --habit-color-4: #10B981; /* Green */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--habit-color-2);
    }

    button.export {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
    }

    button.export:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Habit Cards */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .habit-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .habit-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
    }

    .habit-card[data-index="0"]::before { background-color: var(--habit-color-1); }
    .habit-card[data-index="1"]::before { background-color: var(--habit-color-2); }
    .habit-card[data-index="2"]::before { background-color: var(--habit-color-3); }
    .habit-card[data-index="3"]::before { background-color: var(--habit-color-4); }

    .habit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .habit-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .habit-icon {
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #F1F5F9;
    }

    .habit-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background-color: #ECFDF5;
      color: #059669;
      padding: 0.35rem 0.7rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Day Selectors */
    .habit-checkbox-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .day-check-btn {
      height: 64px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      transition: var(--transition);
      user-select: none;
    }

    .day-check-btn:hover {
      border-color: #CBD5E1;
      transform: translateY(-2px);
    }

    .day-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .day-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .day-check-btn.today {
      border: 2px solid var(--accent);
    }

    .day-check-btn.checked {
      background-color: var(--success) !important;
      border-color: var(--success) !important;
    }

    .day-check-btn.checked .day-label,
    .day-check-btn.checked .day-date {
      color: #FFFFFF !important;
    }

    /* 30-Day Heatmap */
    .heatmap-cells {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
    }

    .heatmap-box {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--cell-empty);
      transition: background-color 0.2s ease;
    }

    .heatmap-box.active {
      background: var(--success);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Habit<span>Box</span></h1>
      <button class="export" id="export-btn">Export Data</button>
    </header>

    <div class="habit-list" id="habit-list"></div>
  </div>

  <script>
    const default_habits = [
      { id: '1', name: 'Exercise', icon: '🏃‍♂️', history: {} },
      { id: '2', name: '3 ltrs of water', icon: '💧', history: {} }
    ];

    let habits = JSON.parse(localStorage.getItem('habits_box_data')) || default_habits;

    function saveState() {
      localStorage.setItem('habits_box_data', JSON.stringify(habits));
      render();
    }

    const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function getLast7Days() {
      const dates = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        dates.push(`${yyyy}-${mm}-${dd}`);
      }
      return dates;
    }

    function getLast30Days() {
      const dates = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        dates.push(`${yyyy}-${mm}-${dd}`);
      }
      return dates;
    }

    function calculateStreak(history) {
      let streak = 0;
      let d = new Date();
      
      const format = (date) => {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };

      let currentStr = format(d);
      if (!history[currentStr]) {
        d.setDate(d.getDate() - 1);
      }

      while (true) {
        const checkStr = format(d);
        if (history[checkStr]) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function toggleCheck(id, dateStr) {
      const habit = habits.find(h => h.id === id);
      if (habit) {
        if (habit.history[dateStr]) {
          delete habit.history[dateStr];
        } else {
          habit.history[dateStr] = true;
        }
        saveState();
      }
    }

    const habitListEl = document.getElementById('habit-list');

    function render() {
      habitListEl.innerHTML = '';
      const recent7Days = getLast7Days();
      const recent30Days = getLast30Days();
      const todayStr = recent7Days[recent7Days.length - 1];

      habits.forEach((habit, index) => {
        const streak = calculateStreak(habit.history);
        
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.setAttribute('data-index', index % 4);

        // Header
        const header = document.createElement('div');
        header.className = 'habit-header';
        header.innerHTML = `
          <div class="habit-meta">
            <div class="habit-icon">${habit.icon}</div>
            <div class="habit-title">${escapeHtml(habit.name)}</div>
          </div>
          <div class="streak-badge">
            🔥 ${streak} day${streak === 1 ? '' : 's'}
          </div>
        `;

        // 7-Day interactive row
        const checkRow = document.createElement('div');
        checkRow.className = 'habit-checkbox-row';

        recent7Days.forEach(dateStr => {
          const parts = dateStr.split('-');
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          const dayName = weekDays[d.getDay()];
          const isDone = Boolean(habit.history[dateStr]);
          const isToday = (dateStr === todayStr);

          const btn = document.createElement('button');
          btn.className = `day-check-btn ${isDone ? 'checked' : ''} ${isToday ? 'today' : ''}`;
          btn.innerHTML = `
            <span class="day-label">${dayName}</span>
            <span class="day-date">${d.getDate()}</span>
          `;
          
          btn.addEventListener('click', () => {
            toggleCheck(habit.id, dateStr);
          });

          checkRow.appendChild(btn);
        });

        // 30-Day Heatmap
        const heatmap = document.createElement('div');
        heatmap.className = 'heatmap-cells';
        recent30Days.forEach(dateStr => {
          const box = document.createElement('div');
          box.className = `heatmap-box ${habit.history[dateStr] ? 'active' : ''}`;
          box.title = dateStr;
          heatmap.appendChild(box);
        });

        card.appendChild(header);
        card.appendChild(checkRow);
        card.appendChild(heatmap);
        habitListEl.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(habits, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `habits-backup.json`;
      a.click();
    });

    render();
  </script>
</body>
</html>
