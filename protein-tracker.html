<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Macro & Protein Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --protein-color: #2563eb;
      --carbs-color: #d97706;
      --fats-color: #059669;
      --danger: #dc2626;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem 3rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .view-switcher {
      display: flex;
      background: #e2e8f0;
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 3px;
    }

    .view-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-tab.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .date-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.45rem 0.8rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .date-input {
      font-weight: 600;
      color: var(--text-main);
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-md);
      outline: none;
      font-size: 0.9rem;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .macro-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 0.5rem;
      text-align: center;
    }

    .macro-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .macro-val {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .macro-val.protein { color: var(--protein-color); }
    .macro-val.carbs { color: var(--carbs-color); }
    .macro-val.fats { color: var(--fats-color); }
    .macro-val.cals { color: var(--text-main); }

    .macro-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--protein-color);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .mode-pills {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .pill-btn {
      flex: 1;
      padding: 0.45rem 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      background: #ffffff;
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .status-msg {
      font-size: 0.75rem;
      color: var(--primary);
      min-height: 1.1rem;
      margin-top: 0.35rem;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
    }

    .item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-tags {
      display: flex;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .tag-p { color: var(--protein-color); font-weight: 600; }
    .tag-c { color: var(--carbs-color); font-weight: 600; }
    .tag-f { color: var(--fats-color); font-weight: 600; }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0 0.25rem;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .chart-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
    }

    .chart-label {
      width: 65px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .chart-bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
    }

    .bar-segment {
      height: 100%;
    }

    .bar-protein { background: var(--protein-color); }
    .bar-carbs { background: var(--carbs-color); }
    .bar-fats { background: var(--fats-color); }

    .chart-val {
      width: 75px;
      text-align: right;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-card {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.85rem;
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="view-switcher">
      <button class="view-tab active" onclick="switchView('daily')">Daily Tracker</button>
      <button class="view-tab" onclick="switchView('weekly')">Weekly (7 Days)</button>
      <button class="view-tab" onclick="switchView('monthly')">Monthly (30 Days)</button>
    </div>

    <div id="dailyView" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="card">
        <div class="date-bar">
          <button class="date-btn" onclick="shiftDate(-1)">&larr; Prev</button>
          <input type="date" id="selectedDate" class="date-input" onchange="onDateChange()">
          <button class="date-btn" onclick="shiftDate(1)">Next &rarr;</button>
        </div>

        <div class="macro-grid">
          <div class="macro-card">
            <div class="macro-name">Protein</div>
            <div class="macro-val protein" id="dayProtein">0g</div>
            <div class="macro-sub">Target: <span id="proteinGoalLabel">120</span>g</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Carbs</div>
            <div class="macro-val carbs" id="dayCarbs">0g</div>
            <div class="macro-sub">Total</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Fats</div>
            <div class="macro-val fats" id="dayFats">0g</div>
            <div class="macro-sub">Total</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Calories</div>
            <div class="macro-val cals" id="dayCalories">0</div>
            <div class="macro-sub">kcal</div>
          </div>
        </div>

        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="dayProgressBar"></div>
        </div>
      </div>

      <div class="card">
        <div class="mode-pills">
          <button class="pill-btn active" id="btnModeAuto" onclick="setEntryMode('auto')">Smart Auto Lookup</button>
          <button class="pill-btn" id="btnModeManual" onclick="setEntryMode('manual')">Manual Macro Entry</button>
        </div>

        <form id="addFoodForm" onsubmit="handleFoodSubmit(event)">
          <div id="autoInputs">
            <div class="form-row">
              <input type="text" id="autoFoodName" placeholder="e.g. Oats, Mutton Curry, Greek Yogurt, Paneer..." autocomplete="off">
              <input type="number" id="autoFoodGrams" placeholder="Grams" style="max-width: 110px;" value="100" min="1">
            </div>
          </div>

          <div id="manualInputs" style="display: none;">
            <div class="form-row">
              <input type="text" id="manualName" placeholder="Item Name (e.g. Protein Shake)">
            </div>
            <div class="form-row">
              <input type="number" id="manP" placeholder="Protein (g)" step="0.1" min="0">
              <input type="number" id="manC" placeholder="Carbs (g)" step="0.1" min="0">
              <input type="number" id="manF" placeholder="Fats (g)" step="0.1" min="0">
            </div>
          </div>

          <div class="status-msg" id="statusMessage"></div>
          <button type="submit" class="btn-submit">+ Log Food</button>
        </form>
      </div>

      <div class="card">
        <div class="feed-header">
          <h2 style="font-size: 1rem; font-weight: 700;">Meals for this Day</h2>
        </div>
        <ul class="feed-list" id="mealsList"></ul>
      </div>
    </div>

    <div id="dashboardView" style="display: none; flex-direction: column; gap: 1.25rem;">
      <div class="card">
        <h2 id="dashTitle" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem;">Weekly Overview</h2>
        <div style="font-size: 0.8rem; color: var(--text-muted);" id="dashSubtitle">Average intake over the period</div>

        <div class="summary-card">
          <div>
            <div class="macro-name">Avg Protein</div>
            <div class="macro-val protein" id="avgProtein" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Carbs</div>
            <div class="macro-val carbs" id="avgCarbs" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Fats</div>
            <div class="macro-val fats" id="avgFats" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Cals</div>
            <div class="macro-val cals" id="avgCals" style="font-size: 1.1rem;">0</div>
          </div>
        </div>

        <div class="chart-container" id="chartFeed"></div>
      </div>
    </div>
  </div>
