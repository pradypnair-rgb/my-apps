<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daily Macro & Protein Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --protein-color: #2563eb;
      --carbs-color: #d97706;
      --fats-color: #059669;
      --danger: #ef4444;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1rem 3rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .view-switcher {
      display: flex;
      background: #e2e8f0;
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 4px;
    }

    .view-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-tab.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .date-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .date-btn:active {
      background: #e2e8f0;
    }

    .date-input {
      font-weight: 700;
      color: var(--text-main);
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-md);
      outline: none;
      font-size: 0.95rem;
      text-align: center;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .macro-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.75rem 0.4rem;
      text-align: center;
    }

    .macro-name {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .macro-val {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .macro-val.protein { color: var(--protein-color); }
    .macro-val.carbs { color: var(--carbs-color); }
    .macro-val.fats { color: var(--fats-color); }
    .macro-val.cals { color: var(--text-main); }

    .macro-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--protein-color);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .mode-pills {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .pill-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Fixed Input Groups & Grid */
    .form-col {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .form-row-auto {
      display: grid;
      grid-template-columns: 1fr 85px 105px;
      gap: 0.5rem;
    }

    .form-row-manual-macros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 100%;
    }

    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%;
      min-width: 0;
      padding: 0.75rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      background: #ffffff;
      color: var(--text-main);
      outline: none;
    }

    select {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .status-msg {
      font-size: 0.8rem;
      min-height: 1.2rem;
      margin-top: 0.4rem;
      font-weight: 600;
    }
    .status-msg.info { color: var(--primary); }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--fats-color); }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .feed-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
    }

    .item-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-tags {
      display: flex;
      gap: 0.45rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .tag-p { color: var(--protein-color); font-weight: 700; }
    .tag-c { color: var(--carbs-color); font-weight: 700; }
    .tag-f { color: var(--fats-color); font-weight: 700; }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 0.35rem;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .chart-bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
    }

    .chart-label {
      width: 70px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .chart-bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
    }

    .bar-segment {
      height: 100%;
    }

    .bar-protein { background: var(--protein-color); }
    .bar-carbs { background: var(--carbs-color); }
    .bar-fats { background: var(--fats-color); }

    .chart-val {
      width: 75px;
      text-align: right;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.85rem;
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="view-switcher">
      <button class="view-tab active" id="tabDaily" onclick="switchView('daily')">Daily Tracker</button>
      <button class="view-tab" id="tabWeekly" onclick="switchView('weekly')">Weekly (7 Days)</button>
      <button class="view-tab" id="tabMonthly" onclick="switchView('monthly')">Monthly (30 Days)</button>
    </div>

    <div id="dailyView" style="display: flex; flex-direction: column; gap: 1.2rem;">
      <div class="card">
        <div class="date-bar">
          <button type="button" class="date-btn" id="btnPrevDay">&larr; Prev</button>
          <input type="date" id="selectedDate" class="date-input">
          <button type="button" class="date-btn" id="btnNextDay">Next &rarr;</button>
        </div>

        <div class="macro-grid">
          <div class="macro-card">
            <div class="macro-name">Protein</div>
            <div class="macro-val protein" id="dayProtein">0g</div>
            <div class="macro-sub">Target: 120g</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Carbs</div>
            <div class="macro-val carbs" id="dayCarbs">0g</div>
            <div class="macro-sub">Total</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Fats</div>
            <div class="macro-val fats" id="dayFats">0g</div>
            <div class="macro-sub">Total</div>
          </div>
          <div class="macro-card">
            <div class="macro-name">Calories</div>
            <div class="macro-val cals" id="dayCalories">0</div>
            <div class="macro-sub">kcal</div>
          </div>
        </div>

        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="dayProgressBar"></div>
        </div>
      </div>

      <div class="card">
        <div class="mode-pills">
          <button type="button" class="pill-btn active" id="btnModeAuto">Smart Auto Lookup</button>
          <button type="button" class="pill-btn" id="btnModeManual">Manual Macro Entry</button>
        </div>

        <form id="addFoodForm">
          <div id="autoInputs" class="form-col">
            <div class="form-row-auto">
              <input type="text" id="autoFoodName" placeholder="e.g. Banana, Oats, Egg, Mutton..." autocomplete="off">
              <input type="number" id="autoFoodQty" placeholder="Qty" value="1" step="any" min="0.1">
              <select id="autoFoodUnit">
                <option value="item">item / pc</option>
                <option value="half">half</option>
                <option value="g">grams (g)</option>
                <option value="scoop">scoop</option>
                <option value="tbsp">tbsp</option>
              </select>
            </div>
          </div>

          <div id="manualInputs" class="form-col" style="display: none;">
            <input type="text" id="manualName" placeholder="Item Name (e.g. Protein Smoothie, Snack)">
            <div class="form-row-manual-macros">
              <input type="number" id="manP" placeholder="Protein (g)" step="0.1" min="0">
              <input type="number" id="manC" placeholder="Carbs (g)" step="0.1" min="0">
              <input type="number" id="manF" placeholder="Fats (g)" step="0.1" min="0">
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btnLogFood">+ Log Food</button>
          <div class="status-msg" id="statusMessage"></div>
        </form>
      </div>

      <div class="card">
        <div class="feed-header">
          <h2 style="font-size: 1rem; font-weight: 700;">Meals for this Day</h2>
        </div>
        <ul class="feed-list" id="mealsList"></ul>
      </div>
    </div>

    <div id="dashboardView" style="display: none; flex-direction: column; gap: 1.2rem;">
      <div class="card">
        <h2 id="dashTitle" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem;">Weekly Overview</h2>
        <div style="font-size: 0.8rem; color: var(--text-muted);" id="dashSubtitle">Average intake over the period</div>

        <div class="summary-card">
          <div>
            <div class="macro-name">Avg Protein</div>
            <div class="macro-val protein" id="avgProtein" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Carbs</div>
            <div class="macro-val carbs" id="avgCarbs" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Fats</div>
            <div class="macro-val fats" id="avgFats" style="font-size: 1.1rem;">0g</div>
          </div>
          <div>
            <div class="macro-name">Avg Cals</div>
            <div class="macro-val cals" id="avgCals" style="font-size: 1.1rem;">0</div>
          </div>
        </div>

        <div class="chart-container" id="chartFeed"></div>
      </div>
    </div>
  </div>

  <script>
    // Master Nutrition DB per 100g or per 1 whole unit (unitWeight: average weight in grams)
    const macroDB = [
      // Fruits & Pieces
      { keys: ["banana", "bananas", "kela"], p: 1.3, c: 27.0, f: 0.3, isUnit: true, unitName: "banana", unitWeight: 118 },
      { keys: ["apple", "apples", "seb"], p: 0.5, c: 25.0, f: 0.3, isUnit: true, unitName: "apple", unitWeight: 180 },
      { keys: ["egg", "eggs", "boiled egg", "anda"], p: 6.3, c: 0.6, f: 5.3, isUnit: true, unitName: "egg", unitWeight: 50 },
      { keys: ["egg white", "egg whites"], p: 3.6, c: 0.2, f: 0.1, isUnit: true, unitName: "egg white", unitWeight: 33 },
      { keys: ["roti", "chapati", "wheat roti", "phulka"], p: 3.2, c: 18.0, f: 0.8, isUnit: true, unitName: "roti", unitWeight: 40 },

      // Protein Powders & Spreads
      { keys: ["whey", "whey protein", "protein powder", "plant protein"], p: 24.0, c: 2.0, f: 1.5, isUnit: true, unitName: "scoop", unitWeight: 30 },
      { keys: ["peanut butter"], p: 4.0, c: 3.2, f: 8.0, isUnit: true, unitName: "tbsp", unitWeight: 16 },

      // Staples per 100g
      { keys: ["oat", "oats", "rolled oats", "oatmeal"], p: 13.5, c: 68.0, f: 6.5 },
      { keys: ["muesli", "granola"], p: 11.0, c: 66.0, f: 5.5 },
      { keys: ["mutton curry", "mutton gravy", "lamb curry", "goat curry"], p: 16.5, c: 4.5, f: 12.0 },
      { keys: ["mutton", "lamb", "goat meat"], p: 25.0, c: 0.0, f: 18.0 },
      { keys: ["chicken breast"], p: 31.0, c: 0.0, f: 3.6 },
      { keys: ["chicken curry", "chicken gravy"], p: 17.0, c: 4.0, f: 9.0 },
      { keys: ["chicken", "chicken thigh"], p: 27.0, c: 0.0, f: 7.5 },
      { keys: ["greek yogurt", "hung curd"], p: 10.0, c: 3.6, f: 0.4 },
      { keys: ["curd", "yogurt", "dahi"], p: 3.5, c: 4.7, f: 3.2 },
      { keys: ["paneer", "cottage cheese"], p: 18.0, c: 3.0, f: 20.0 },
      { keys: ["tofu"], p: 17.0, c: 2.0, f: 9.0 },
      { keys: ["dal", "daal", "lentils", "yellow dal", "moong dal"], p: 6.5, c: 18.0, f: 2.5 },
      { keys: ["chana", "chickpeas", "chole"], p: 8.9, c: 27.0, f: 2.6 },
      { keys: ["rajma", "kidney beans"], p: 8.7, c: 23.0, f: 0.5 },
      { keys: ["soya chunks", "soy chunks", "soya"], p: 52.0, c: 33.0, f: 0.5 },
      { keys: ["rice", "white rice", "cooked rice"], p: 2.7, c: 28.0, f: 0.3 },
      { keys: ["milk", "whole milk"], p: 3.4, c: 4.8, f: 3.5 },
      { keys: ["almond", "almonds", "badam"], p: 21.0, c: 22.0, f: 49.0 },
      { keys: ["chia seed", "chia seeds"], p: 16.5, c: 42.0, f: 30.7 },
      { keys: ["protein smoothie", "smoothie"], p: 15.0, c: 25.0, f: 4.0 }
    ];

    function toISODate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let allLogs = JSON.parse(localStorage.getItem('macro_tracker_logs')) || [];
    let proteinGoal = 120;
    let currentDate = new Date();
    let currentMode = 'auto';
    let currentView = 'daily';

    const dateInput = document.getElementById('selectedDate');
    const statusEl = document.getElementById('statusMessage');

    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = `status-msg ${type}`;
      if (type === 'success') {
        setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 3500);
      }
    }

    function syncDateDisplay() {
      dateInput.value = toISODate(currentDate);
      renderDaily();
    }

    document.getElementById('btnPrevDay').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      syncDateDisplay();
    });

    document.getElementById('btnNextDay').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      syncDateDisplay();
    });

    dateInput.addEventListener('change', (e) => {
      if (e.target.value) {
        const parts = e.target.value.split('-');
        currentDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      } else {
        currentDate = new Date();
      }
      syncDateDisplay();
    });

    document.getElementById('btnModeAuto').addEventListener('click', () => setEntryMode('auto'));
    document.getElementById('btnModeManual').addEventListener('click', () => setEntryMode('manual'));

    function setEntryMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeAuto').classList.toggle('active', mode === 'auto');
      document.getElementById('btnModeManual').classList.toggle('active', mode === 'manual');
      document.getElementById('autoInputs').style.display = mode === 'auto' ? 'flex' : 'none';
      document.getElementById('manualInputs').style.display = mode === 'manual' ? 'flex' : 'none';
      setStatus('');
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tabDaily').classList.toggle('active', view === 'daily');
      document.getElementById('tabWeekly').classList.toggle('active', view === 'weekly');
      document.getElementById('tabMonthly').classList.toggle('active', view === 'monthly');

      if (view === 'daily') {
        document.getElementById('dailyView').style.display = 'flex';
        document.getElementById('dashboardView').style.display = 'none';
        renderDaily();
      } else {
        document.getElementById('dailyView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'flex';
        renderDashboard(view === 'weekly' ? 7 : 30);
      }
    }

    function findInLocalDB(query) {
      const q = query.toLowerCase().trim();
      for (const item of macroDB) {
        if (item.keys.some(k => q === k || q.includes(k) || k.includes(q))) {
          return item;
        }
      }
      return null;
    }

    async function queryOpenFoodFacts(query) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=2`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data.products && data.products.length > 0) {
          const p = data.products[0];
          return {
            p: parseFloat(p.nutriments?.proteins_100g || 0),
            c: parseFloat(p.nutriments?.carbohydrates_100g || 0),
            f: parseFloat(p.nutriments?.fat_100g || 0)
          };
        }
      } catch (err) {
        // graceful offline fallback
      }
      return null;
    }

    document.getElementById('addFoodForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const activeDateStr = toISODate(currentDate);

      if (currentMode === 'manual') {
        const name = document.getElementById('manualName').value.trim() || 'Custom Food';
        const p = parseFloat(document.getElementById('manP').value) || 0;
        const c = parseFloat(document.getElementById('manC').value) || 0;
        const f = parseFloat(document.getElementById('manF').value) || 0;

        if (p === 0 && c === 0 && f === 0) {
          setStatus('Please enter at least one macro amount.', 'error');
          return;
        }

        saveEntry(activeDateStr, name, p, c, f, 'Manual Entry');
        document.getElementById('manualName').value = '';
        document.getElementById('manP').value = '';
        document.getElementById('manC').value = '';
        document.getElementById('manF').value = '';
        setStatus(`Logged ${name}!`, 'success');
        return;
      }

      // Auto Mode
      let rawQuery = document.getElementById('autoFoodName').value.trim();
      let qty = parseFloat(document.getElementById('autoFoodQty').value);
      const unit = document.getElementById('autoFoodUnit').value;

      if (!rawQuery || isNaN(qty) || qty <= 0) {
        setStatus('Please enter food name and quantity.', 'error');
        return;
      }

      // Handle "half" in query text or selector
      if (rawQuery.toLowerCase().startsWith('half ')) {
        rawQuery = rawQuery.replace(/^half\s+/i, '');
        qty = qty * 0.5;
      } else if (unit === 'half') {
        qty = qty * 0.5;
      }

      const localMatch = findInLocalDB(rawQuery);
      let calculatedP = 0, calculatedC = 0, calculatedF = 0, detailLabel = '';

      if (localMatch) {
        if (localMatch.isUnit && (unit === 'item' || unit === 'half' || unit === 'scoop' || unit === 'tbsp')) {
          calculatedP = localMatch.p * qty;
          calculatedC = localMatch.c * qty;
          calculatedF = localMatch.f * qty;
          detailLabel = `${qty} ${localMatch.unitName || 'unit'}`;
        } else {
          // Weight calculation
          const totalGrams = (unit === 'g') ? qty : (localMatch.unitWeight ? (qty * localMatch.unitWeight) : (qty * 100));
          const factor = totalGrams / 100;
          calculatedP = localMatch.p * factor;
          calculatedC = localMatch.c * factor;
          calculatedF = localMatch.f * factor;
          detailLabel = `${totalGrams}g`;
        }

        saveEntry(activeDateStr, rawQuery, calculatedP, calculatedC, calculatedF, detailLabel);
        document.getElementById('autoFoodName').value = '';
        setStatus(`Logged ${detailLabel} ${rawQuery}!`, 'success');
        return;
      }

      // Web API fallback (calculates as grams)
      setStatus('Searching online database...', 'info');
      const totalGrams = (unit === 'g') ? qty : (qty * 100);
      const factor = totalGrams / 100;
      const webMatch = await queryOpenFoodFacts(rawQuery);

      if (webMatch) {
        saveEntry(activeDateStr, rawQuery, webMatch.p * factor, webMatch.c * factor, webMatch.f * factor, `${totalGrams}g (Web)`);
        document.getElementById('autoFoodName').value = '';
        setStatus(`Logged ${totalGrams}g ${rawQuery}!`, 'success');
      } else {
        setStatus(`No entry found for "${rawQuery}". Switch to Manual Macro Entry.`, 'error');
      }
    });

    function saveEntry(dateStr, name, p, c, f, details) {
      const cals = Math.round((p * 4) + (c * 4) + (f * 9));
      const entry = {
        id: Date.now(),
        date: dateStr,
        name: name.charAt(0).toUpperCase() + name.slice(1),
        p: Math.round(p * 10) / 10,
        c: Math.round(c * 10) / 10,
        f: Math.round(f * 10) / 10,
        cals: cals,
        details: details
      };

      allLogs.unshift(entry);
      localStorage.setItem('macro_tracker_logs', JSON.stringify(allLogs));
      renderDaily();
    }

    window.deleteEntry = function(id) {
      allLogs = allLogs.filter(item => item.id !== id);
      localStorage.setItem('macro_tracker_logs', JSON.stringify(allLogs));
      renderDaily();
    };

    function renderDaily() {
      const activeDateStr = toISODate(currentDate);
      const dayLogs = allLogs.filter(item => item.date === activeDateStr);

      const totalP = Math.round(dayLogs.reduce((acc, i) => acc + (Number(i.p) || 0), 0) * 10) / 10;
      const totalC = Math.round(dayLogs.reduce((acc, i) => acc + (Number(i.c) || 0), 0) * 10) / 10;
      const totalF = Math.round(dayLogs.reduce((acc, i) => acc + (Number(i.f) || 0), 0) * 10) / 10;
      const totalCals = dayLogs.reduce((acc, i) => acc + (Number(i.cals) || 0), 0);

      document.getElementById('dayProtein').textContent = `${totalP}g`;
      document.getElementById('dayCarbs').textContent = `${totalC}g`;
      document.getElementById('dayFats').textContent = `${totalF}g`;
      document.getElementById('dayCalories').textContent = totalCals;

      const pct = Math.min(Math.round((totalP / proteinGoal) * 100), 100);
      document.getElementById('dayProgressBar').style.width = `${pct}%`;

      const list = document.getElementById('mealsList');
      list.innerHTML = '';

      if (dayLogs.length === 0) {
        list.innerHTML = `<li style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1.5rem 0;">No foods logged for this date.</li>`;
        return;
      }

      dayLogs.forEach(item => {
        const li = document.createElement('li');
        li.className = 'feed-item';
        li.innerHTML = `
          <div>
            <div class="item-title">${item.name} <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">(${item.details})</span></div>
            <div class="item-tags">
              <span class="tag-p">${item.p}g P</span> • 
              <span class="tag-c">${item.c}g C</span> • 
              <span class="tag-f">${item.f}g F</span> • 
              <span>${item.cals} kcal</span>
            </div>
          </div>
          <button type="button" class="btn-delete" onclick="deleteEntry(${item.id})">&times;</button>
        `;
        list.appendChild(li);
      });
    }

    function renderDashboard(daysCount) {
      document.getElementById('dashTitle').textContent = daysCount === 7 ? 'Weekly Overview (Last 7 Days)' : 'Monthly Overview (Last 30 Days)';
      document.getElementById('dashSubtitle').textContent = `Average intake over the past ${daysCount} days`;

      const chartFeed = document.getElementById('chartFeed');
      chartFeed.innerHTML = '';

      let totalP = 0, totalC = 0, totalF = 0, totalCals = 0;
      const today = new Date();

      for (let i = daysCount - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const dateStr = toISODate(d);
        const label = d.toLocaleDateString([], { month: 'short', day: 'numeric' });

        const dayLogs = allLogs.filter(item => item.date === dateStr);
        const p = dayLogs.reduce((acc, item) => acc + (Number(item.p) || 0), 0);
        const c = dayLogs.reduce((acc, item) => acc + (Number(item.c) || 0), 0);
        const f = dayLogs.reduce((acc, item) => acc + (Number(item.f) || 0), 0);
        const cals = dayLogs.reduce((acc, item) => acc + (Number(item.cals) || 0), 0);

        totalP += p; totalC += c; totalF += f; totalCals += cals;

        const macroSum = (p + c + f) || 1;
        const pPct = (p / macroSum) * 100;
        const cPct = (c / macroSum) * 100;
        const fPct = (f / macroSum) * 100;

        const row = document.createElement('div');
        row.className = 'chart-bar-row';
        row.innerHTML = `
          <div class="chart-label">${label}</div>
          <div class="chart-bar-track" title="P: ${Math.round(p)}g | C: ${Math.round(c)}g | F: ${Math.round(f)}g">
            <div class="bar-segment bar-protein" style="width: ${p ? pPct : 0}%"></div>
            <div class="bar-segment bar-carbs" style="width: ${c ? cPct : 0}%"></div>
            <div class="bar-segment bar-fats" style="width: ${f ? fPct : 0}%"></div>
          </div>
          <div class="chart-val">${Math.round(p)}g P</div>
        `;
        chartFeed.appendChild(row);
      }

      document.getElementById('avgProtein').textContent = `${Math.round(totalP / daysCount)}g`;
      document.getElementById('avgCarbs').textContent = `${Math.round(totalC / daysCount)}g`;
      document.getElementById('avgFats').textContent = `${Math.round(totalF / daysCount)}g`;
      document.getElementById('avgCals').textContent = Math.round(totalCals / daysCount);
    }

    syncDateDisplay();
  </script>
</body>
</html>
